name: Dify midnight acceptance
on:
  workflow_dispatch:
  push:
    branches: [2026-competition-ecosystem]
    paths: ['dify/**', '.github/workflows/dify-midnight.yml']
permissions:
  contents: read
jobs:
  real-dify-seekdb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned dependencies and initialize isolated secrets
        run: |
          npm ci --ignore-scripts
          python3 scripts/init-env.py
          docker compose config --quiet
      - name: Start, import and verify through the documented entry point
        run: bash start.sh --acceptance
      - name: Browser walkthrough and screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 scripts/web.py > /tmp/midnight-web.log 2>&1 &
          node tests/browser.mjs
      - name: Record image digests
        if: always()
        run: |
          mkdir -p results
          docker image ls --digests > results/images.txt
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 100 api worker sandbox ssrf_proxy game seekdb plugin_daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dify-midnight-real-run
          path: dify/results/
      - name: Stop isolated deployment
        if: always()
        run: docker compose down -v
