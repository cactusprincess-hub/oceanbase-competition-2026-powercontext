# Only the game's internal data service is reachable from HTTP workflow nodes.
http_port 3128
acl game_service dstdomain game
acl game_port port 3100
http_access allow game_service game_port
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /tmp/squid.pid
