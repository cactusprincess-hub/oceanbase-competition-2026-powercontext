name: midnight-game
x-dify-env: &dify-env
  SECRET_KEY: ${DIFY_SECRET:?Run python3 scripts/init-env.py}
  DB_USERNAME: postgres
  DB_PASSWORD: ${DB_PASSWORD:?Run init-env}
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Run init-env}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  STORAGE_TYPE: opendal
  OPENDAL_SCHEME: fs
  OPENDAL_FS_ROOT: storage
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  CODE_EXECUTION_API_KEY: ${SANDBOX_KEY:?Run init-env}
  SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
  SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
  CONSOLE_CORS_ALLOW_ORIGINS: http://localhost:8080
  WEB_API_CORS_ALLOW_ORIGINS: http://localhost:8080
  PLUGIN_DAEMON_URL: http://plugin_daemon:5002
  PLUGIN_DAEMON_KEY: ${PLUGIN_KEY:?Run init-env}
  INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_INNER_KEY:?Run init-env}
  SERVER_WORKER_AMOUNT: 1
  CELERY_WORKER_AMOUNT: 1
  CELERY_AUTO_SCALE: 'false'
  LOG_LEVEL: WARNING
  CHECK_UPDATE_URL: ''
services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615@sha256:4db4961869d554313520d6081fca29265ba6da6db7313311bd8acbed771a956b
    environment:
      ROOT_PASSWORD: ${SEEKDB_PASSWORD:?Run init-env}
      CPU_COUNT: '2'
      MEMORY_LIMIT: 3G
      DATAFILE_SIZE: 1G
      DATAFILE_MAXSIZE: 2G
      LOG_DISK_SIZE: 2G
    volumes: [seekdb-data:/var/lib/seekdb]
  game:
    build: .
    environment:
      SEEKDB_HOST: seekdb
      SEEKDB_PORT: 2881
      SEEKDB_PASSWORD: ${SEEKDB_PASSWORD}
      GAME_TOKEN: ${GAME_TOKEN:?Run init-env}
    depends_on: [seekdb]
    ports: ['127.0.0.1:3100:3100']
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dify
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dify']
      interval: 3s
      timeout: 3s
      retries: 60
  redis:
    image: redis:6-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
  api:
    image: langgenius/dify-api:1.9.1
    environment:
      <<: *dify-env
      MODE: api
      MIGRATION_ENABLED: 'true'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [dify-storage:/app/api/storage]
    ports: ['127.0.0.1:5001:5001']
  worker:
    image: langgenius/dify-api:1.9.1
    environment:
      <<: *dify-env
      MODE: worker
      MIGRATION_ENABLED: 'false'
    depends_on: [api]
    volumes: [dify-storage:/app/api/storage]
  sandbox:
    image: langgenius/dify-sandbox:0.2.12
    environment:
      API_KEY: ${SANDBOX_KEY}
      GIN_MODE: release
      ENABLE_NETWORK: 'false'
      WORKER_TIMEOUT: 15
    volumes: [sandbox-deps:/dependencies]
  ssrf_proxy:
    image: ubuntu/squid:latest
    volumes: ['./squid.conf:/etc/squid/squid.conf:ro']
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.3.0-local
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: dify_plugin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_KEY: ${PLUGIN_KEY}
      SERVER_PORT: 5002
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_INNER_KEY}
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
    depends_on:
      db: {condition: service_healthy}
    volumes: [plugin-storage:/app/storage]
  web:
    image: langgenius/dify-web:1.9.1
    environment:
      CONSOLE_API_URL: http://localhost:5001
      APP_API_URL: http://localhost:5001
    ports: ['127.0.0.1:8080:3000']
volumes:
  seekdb-data:
  postgres-data:
  dify-storage:
  sandbox-deps:
  plugin-storage:
