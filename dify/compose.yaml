name: midnight-game
x-dify-env: &dify-env
  SECRET_KEY: ${DIFY_SECRET:?Run python3 scripts/init-env.py}
  DB_USERNAME: postgres
  DB_PASSWORD: ${DB_PASSWORD:?Run init-env}
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Run init-env}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  STORAGE_TYPE: opendal
  OPENDAL_SCHEME: fs
  OPENDAL_FS_ROOT: storage
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  CODE_EXECUTION_API_KEY: ${SANDBOX_KEY:?Run init-env}
  SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
  SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
  CONSOLE_CORS_ALLOW_ORIGINS: http://localhost:8080
  WEB_API_CORS_ALLOW_ORIGINS: http://localhost:8080
  PLUGIN_DAEMON_URL: http://plugin_daemon:5002
  PLUGIN_DAEMON_KEY: ${PLUGIN_KEY:?Run init-env}
  INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_INNER_KEY:?Run init-env}
  SERVER_WORKER_AMOUNT: 1
  CELERY_WORKER_AMOUNT: 1
  CELERY_AUTO_SCALE: 'false'
  LOG_LEVEL: WARNING
  CHECK_UPDATE_URL: ''
services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615@sha256:4db4961869d554313520d6081fca29265ba6da6db7313311bd8acbed771a956b
    environment:
      ROOT_PASSWORD: ${SEEKDB_PASSWORD:?Run init-env}
      CPU_COUNT: '2'
      MEMORY_LIMIT: 3G
      DATAFILE_SIZE: 1G
      DATAFILE_MAXSIZE: 2G
      LOG_DISK_SIZE: 2G
    volumes: [seekdb-data:/var/lib/seekdb]
  game:
    build: .
    environment:
      SEEKDB_HOST: seekdb
      SEEKDB_PORT: 2881
      SEEKDB_PASSWORD: ${SEEKDB_PASSWORD}
      GAME_TOKEN: ${GAME_TOKEN:?Run init-env}
    depends_on: [seekdb]
    ports: ['127.0.0.1:3100:3100']
  db:
    image: postgres:15-alpine@sha256:23799e521dee9265a8b388ecf3bc0f1eaa34b95be67f5a76af4f8f6adb44c720
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dify
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dify']
      interval: 3s
      timeout: 3s
      retries: 60
  redis:
    image: redis:6-alpine@sha256:3f9c6e23ed6bea3b41d0ef709fc164c1a0b7c00d5a21a60e0e9c33ada5496881
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
  api:
    image: langgenius/dify-api:1.9.1@sha256:c38936ee0149f8fabfb5f02ac716c545aa758ceef78c2369c733a86f8713aad4
    environment:
      <<: *dify-env
      MODE: api
      MIGRATION_ENABLED: 'true'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [dify-storage:/app/api/storage]
    ports: ['127.0.0.1:5001:5001']
    networks: [default, sandbox-isolated]
  worker:
    image: langgenius/dify-api:1.9.1@sha256:c38936ee0149f8fabfb5f02ac716c545aa758ceef78c2369c733a86f8713aad4
    environment:
      <<: *dify-env
      MODE: worker
      MIGRATION_ENABLED: 'false'
    depends_on: [api]
    volumes: [dify-storage:/app/api/storage]
    networks: [default, sandbox-isolated]
  sandbox:
    image: langgenius/dify-sandbox:0.2.12@sha256:4e65e8a351a2b17d11750b65403527a347e5cb938bc2271521ca7d689c008ad3
    environment:
      API_KEY: ${SANDBOX_KEY}
      GIN_MODE: release
      ENABLE_NETWORK: 'true'
      WORKER_TIMEOUT: 15
    volumes: [sandbox-deps:/dependencies]
    networks: [sandbox-isolated]
  ssrf_proxy:
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    volumes: ['./squid.conf:/etc/squid/squid.conf:ro']
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.3.0-local@sha256:22fb3bed3803b094b779a1db2684797e2feeae339f9612273fec7db14ecd03cd
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: dify_plugin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_KEY: ${PLUGIN_KEY}
      SERVER_PORT: 5002
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      PLUGIN_MAX_EXECUTION_TIMEOUT: 600
      PYTHON_ENV_INIT_TIMEOUT: 120
      FORCE_VERIFYING_SIGNATURE: 'true'
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_INNER_KEY}
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
    depends_on:
      db: {condition: service_healthy}
    volumes: [plugin-storage:/app/storage]
  web:
    image: langgenius/dify-web:1.9.1@sha256:53af9883e89e96eac6885a9519c5230d89ba112855d6f98b0d907656e02ead81
    environment:
      CONSOLE_API_URL: http://localhost:5001
      APP_API_URL: http://localhost:5001
    ports: ['127.0.0.1:8080:3000']
volumes:
  seekdb-data:
  postgres-data:
  dify-storage:
  sandbox-deps:
  plugin-storage:

networks:
  sandbox-isolated:
    internal: true
