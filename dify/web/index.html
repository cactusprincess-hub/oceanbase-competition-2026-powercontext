<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>午夜失物招领</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,sans-serif;color:#e8e6f2;background:#0c1120}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#303356 0%,transparent 50%)}main{max-width:1040px;margin:auto;padding:52px 24px}.eyebrow{color:#adaccd;letter-spacing:.2em;font-size:12px}h1{font-size:clamp(32px,6vw,60px);font-weight:550;margin:14px 0}p{color:#adaccd;line-height:1.8}.layout{display:grid;grid-template-columns:1fr 290px;gap:24px;margin-top:34px}.panel{background:#151c2e;border:1px solid #333c55;border-radius:18px;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{font-size:12px;color:#d3d0ff;background:#353451;border-radius:20px;padding:8px 12px}#story{white-space:pre-wrap;line-height:1.9;min-height:250px}button,input{font:inherit;border:1px solid #46516e;border-radius:9px;padding:12px;color:#eeedf6;background:#222c43}button{cursor:pointer}button:hover{background:#3a4161}button:disabled{opacity:.5;cursor:wait}.places{display:grid;grid-template-columns:1fr 1fr;gap:10px}h2{font-size:16px;font-weight:500;color:#cdcbe1;margin:0 0 18px}.actions{display:flex;gap:8px;margin-top:18px}input{min-width:0;flex:1}#error{color:#ffa7a7;white-space:pre-wrap;font-size:13px}#save{word-break:break-all;font-family:monospace;font-size:12px;color:#898da8}.small{font-size:12px}.primary{background:#7772bc;color:white;border-color:#9994dc}footer{padding-top:28px;font-size:12px;color:#7e859f}@media(max-width:740px){main{padding-top:30px}.layout{grid-template-columns:1fr}}
</style>
<main><div class="eyebrow">THE LAST TRAIN · INTERACTIVE MYSTERY</div><h1>午夜失物招领</h1><p>末班车离站后，你的车票被锁进了失物箱。<br>探索四个地点，收集三份证据，在十二次行动内找到回家的路。</p>
<div class="layout"><section class="panel"><div class="top"><h2>车站值班记录</h2><span class="pill" id="status">等待开始</span></div><div id="story" aria-live="polite">输入“开始”，或点击下方按钮。你的探索进度会自动保存。</div><form class="actions" id="form"><input id="command" aria-label="行动指令" maxlength="100" placeholder="例如：打开 123456" autocomplete="off"><button class="primary">发送</button></form><div id="error" role="alert"></div></section>
<aside class="panel"><h2>前往地点</h2><div class="places"><button data-action="去大厅">大厅</button><button data-action="去站台">站台</button><button data-action="去仓库">仓库</button><button data-action="去广播室">广播室</button></div><h2 style="margin-top:28px">行动</h2><div class="places"><button class="primary" data-action="查看">查看线索</button><button data-action="背包">证据背包</button><button data-action="提示">求助提示</button><button data-action="重来">重新开始</button></div><p class="small">移动和查看各消耗一次行动；提示会扣分。状态和背包不消耗行动。</p><div id="save"></div></aside></div><footer>存档在此浏览器自动续接。请妥善保存存档ID，持有ID即可继续对应游戏。</footer></main>
<script>
let session=localStorage.getItem('midnight-session');if(!/^[a-f0-9]{32}$/.test(session||'')){session=[...crypto.getRandomValues(new Uint8Array(16))].map(n=>n.toString(16).padStart(2,'0')).join('');localStorage.setItem('midnight-session',session)}
document.getElementById('save').textContent='存档ID：'+session;
async function act(command){const buttons=document.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);document.getElementById('error').textContent='';try{const response=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session,command})});const value=await response.json();if(!response.ok)throw Error(value.error||'运行失败');document.getElementById('story').textContent=value.reply;const state=JSON.parse(value.state);document.getElementById('status').textContent=state.status==='won'?'已找回车票':state.status==='lost'?'电量耗尽':`${state.room} · 剩余 ${12-state.turns} 次`;document.getElementById('command').value=''}catch(error){document.getElementById('error').textContent=error.message}finally{buttons.forEach(b=>b.disabled=false)}}
document.getElementById('form').addEventListener('submit',event=>{event.preventDefault();const command=document.getElementById('command').value.trim();if(command)act(command)});document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>act(button.dataset.action)));act('状态');
</script></html>
