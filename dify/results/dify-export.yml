app:
  description: 12次行动内解开午夜车站的失物箱。Dify负责游戏规则，seekdb保存证据与跨次进度，无需模型Key。
  icon: 🌙
  icon_background: '#E8E5FF'
  mode: workflow
  name: 午夜失物招领
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: seekdb数据服务地址
    id: c4e83210-67ba-493f-91f0-000000000001
    name: game_url
    selector:
    - env
    - game_url
    value: http://game:3100
    value_type: string
  - description: 填写本地GAME_TOKEN
    id: c4e83210-67ba-493f-91f0-000000000002
    name: game_token
    selector:
    - env
    - game_token
    value: ''
    value_type: secret
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-prepare
      source: start
      sourceHandle: source
      target: prepare
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: prepare-context
      source: prepare
      sourceHandle: source
      target: context
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: context-game
      source: context
      sourceHandle: source
      target: game
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: game-save
      source: game
      sourceHandle: source
      target: save
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: save-confirm
      source: save
      sourceHandle: source
      target: confirm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: confirm-end
      source: confirm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 玩家输入
        type: start
        variables:
        - label: 存档ID（32位小写十六进制）
          max_length: 32
          options: []
          required: true
          type: text-input
          variable: session_id
        - label: 命令，例如：开始、去站台、查看
          max_length: 100
          options: []
          required: true
          type: text-input
          variable: command
      height: 100
      id: start
      position:
        x: 50
        y: 180
      positionAbsolute:
        x: 50
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\nimport re\n\n\ndef main(session_id: str, command: str)\
          \ -> dict:\n    if not re.fullmatch(r\"[a-f0-9]{32}\", session_id):\n  \
          \      raise ValueError(\"session_id 必须为32位小写十六进制字符串；请先生成独立的游戏存档编号\")\n\
          \    if not command.strip() or len(command) > 100:\n        raise ValueError(\"\
          命令不能为空且不能超过100个字符\")\n    return {\"body\": json.dumps({\"session_id\":\
          \ session_id}), \"command\": command.strip()}\n"
        code_language: python3
        desc: ''
        outputs:
          body:
            children: null
            type: string
          command:
            children: null
            type: string
        selected: false
        title: 校验输入与构造请求
        type: code
        variables:
        - value_selector:
          - start
          - session_id
          variable: session_id
        - value_selector:
          - start
          - command
          variable: command
      height: 100
      id: prepare
      position:
        x: 360
        y: 180
      positionAbsolute:
        x: 360
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          type: no-auth
        body:
          data:
          - id: body
            key: ''
            type: text
            value: '{{#prepare.body#}}'
          type: raw-text
        desc: ''
        headers: 'Content-Type: application/json

          Authorization: Bearer {{#env.game_token#}}'
        method: POST
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: false
          retry_interval: 1000
        selected: false
        timeout:
          connect: 10
          read: 30
          write: 30
        title: seekdb读取存档与场景证据
        type: http-request
        url: '{{#env.game_url#}}/context'
      height: 100
      id: context
      position:
        x: 670
        y: 180
      positionAbsolute:
        x: 670
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(body: str, command: str, status_code: int)\
          \ -> dict:\n    if status_code != 200:\n        raise ValueError(\"线索读取失败，未执行行动；请检查数据服务\"\
          )\n    context = json.loads(body)\n    state = context[\"state\"]\n    scenes\
          \ = {scene[\"room\"]: scene for scene in context[\"scenes\"]}\n    command\
          \ = command.strip()\n    message = \"\"\n    if command in (\"重来\", \"开始\"\
          ):\n        state = {\"room\": \"大厅\", \"inventory\": [], \"turns\": 0,\
          \ \"hints\": 0, \"status\": \"playing\"}\n        message = scenes[\"大厅\"\
          ][\"description\"] + \" 先试试『去站台』。\"\n    elif command in (\"帮助\", \"状态\"\
          , \"背包\"):\n        message = \"探索四个地点，查看并收集证据，回到大厅打开失物箱。帮助、状态、背包不消耗电量。\"\
          \n    elif state[\"status\"] != \"playing\":\n        message = \"这一局已结束。输入『重来』可开始新一局。\"\
          \n    elif command == \"提示\":\n        state[\"turns\"] += 1\n        state[\"\
          hints\"] += 1\n        needed = [room for room in (\"站台\", \"仓库\", \"广播室\"\
          ) if scenes[room][\"clue_id\"] not in state[\"inventory\"]]\n        message\
          \ = \"试着去\" + needed[0] + \"，然后『查看』。\" if needed else \"证据已齐，回大厅，按照值班记录组合密码。\"\
          \n    elif command.startswith(\"去\") and command[1:].strip() in scenes:\n\
          \        state[\"room\"] = command[1:].strip()\n        state[\"turns\"\
          ] += 1\n        message = scenes[state[\"room\"]][\"description\"]\n   \
          \ elif command == \"查看\":\n        state[\"turns\"] += 1\n        scene\
          \ = scenes[state[\"room\"]]\n        if scene[\"clue_id\"] not in state[\"\
          inventory\"]:\n            state[\"inventory\"].append(scene[\"clue_id\"\
          ])\n        message = \"【\" + scene[\"clue_id\"] + \"】\" + scene[\"clue_text\"\
          ]\n    elif command.startswith(\"打开\"):\n        if state[\"room\"] != \"\
          大厅\":\n            message = \"失物箱在大厅。输入『去大厅』返回。\"\n        else:\n    \
          \        state[\"turns\"] += 1\n            code = command[2:].strip()\n\
          \            required = {scenes[room][\"clue_id\"] for room in (\"站台\",\
          \ \"仓库\", \"广播室\")}\n            if not required.issubset(set(state[\"inventory\"\
          ])):\n                message = \"锁屏提示：证据不足。请先查看机械钟、旧票根与值班记录。\"\n      \
          \      elif code != scenes[\"站台\"][\"fragment\"] + scenes[\"仓库\"][\"fragment\"\
          ]:\n                message = \"密码错误，失物箱轻轻闪了一下红灯。别把划掉的票号当成站台号。\"\n     \
          \       else:\n                state[\"status\"] = \"won\"\n           \
          \     message = \"失物箱打开了！里面是你的车票，还有一行字：『最后一班车，会等找回自己的人。』你成功回家。\"\n    else:\n\
          \        message = \"没听懂这条指令。请使用下方选项；无效指令不消耗电量。\"\n    if state[\"turns\"\
          ] >= 12 and state[\"status\"] == \"playing\":\n        state[\"status\"\
          ] = \"lost\"\n        message += \" 电量耗尽，天亮前无法开箱。输入『重来』再试一次。\"\n    score\
          \ = max(0, 100 - state[\"turns\"] * 3 - state[\"hints\"] * 8) if state[\"\
          status\"] == \"won\" else 0\n    evidence = [scene[\"clue_text\"] for scene\
          \ in context[\"scenes\"] if scene[\"clue_id\"] in state[\"inventory\"]]\n\
          \    reply = (message + \"\\n\\n地点：\" + state[\"room\"] + \" | 剩余行动：\" +\
          \ str(12 - state[\"turns\"]) +\n             \" | 状态：\" + state[\"status\"\
          ] + \" | 得分：\" + str(score) +\n             \"\\n证据背包：\" + (\"；\".join(evidence)\
          \ or \"空\") +\n             \"\\n可用指令：去大厅 / 去站台 / 去仓库 / 去广播室 / 查看 / 打开 <密码>\
          \ / 提示 / 背包 / 状态 / 重来\")\n    payload = {\"session_id\": context[\"session_id\"\
          ], \"version\": context[\"version\"], \"state\": state, \"command\": command,\
          \ \"reply\": reply}\n    return {\"body\": json.dumps(payload, ensure_ascii=False)}\n"
        code_language: python3
        desc: ''
        outputs:
          body:
            children: null
            type: string
        selected: false
        title: 行动判断、线索组合与胜负
        type: code
        variables:
        - value_selector:
          - context
          - body
          variable: body
        - value_selector:
          - context
          - status_code
          variable: status_code
        - value_selector:
          - prepare
          - command
          variable: command
      height: 100
      id: game
      position:
        x: 980
        y: 180
      positionAbsolute:
        x: 980
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          type: no-auth
        body:
          data:
          - id: body
            key: ''
            type: text
            value: '{{#game.body#}}'
          type: raw-text
        desc: ''
        headers: 'Content-Type: application/json

          Authorization: Bearer {{#env.game_token#}}'
        method: POST
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: false
          retry_interval: 1000
        selected: false
        timeout:
          connect: 10
          read: 30
          write: 30
        title: seekdb事务保存进度与行动记录
        type: http-request
        url: '{{#env.game_url#}}/commit'
      height: 100
      id: save
      position:
        x: 1290
        y: 180
      positionAbsolute:
        x: 1290
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(body: str, status_code: int) -> dict:\n \
          \   result = json.loads(body)\n    if status_code != 200 or not result.get(\"\
          saved\"):\n        raise ValueError(result.get(\"error\", \"进度保存失败；请稍后重试\"\
          ))\n    return {\"reply\": result[\"reply\"], \"status\": result[\"state\"\
          ][\"status\"],\n            \"version\": result[\"version\"], \"state\"\
          : json.dumps(result[\"state\"], ensure_ascii=False)}\n"
        code_language: python3
        desc: ''
        outputs:
          reply:
            children: null
            type: string
          state:
            children: null
            type: string
          status:
            children: null
            type: string
          version:
            children: null
            type: number
        selected: false
        title: 确认持久化结果
        type: code
        variables:
        - value_selector:
          - save
          - body
          variable: body
        - value_selector:
          - save
          - status_code
          variable: status_code
      height: 100
      id: confirm
      position:
        x: 1600
        y: 180
      positionAbsolute:
        x: 1600
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - confirm
          - reply
          value_type: string
          variable: reply
        - value_selector:
          - confirm
          - status
          value_type: string
          variable: status
        - value_selector:
          - confirm
          - version
          value_type: number
          variable: version
        - value_selector:
          - confirm
          - state
          value_type: string
          variable: state
        selected: false
        title: 返回故事与下一步选项
        type: end
      height: 100
      id: end
      position:
        x: 1910
        y: 180
      positionAbsolute:
        x: 1910
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.65
  rag_pipeline_variables: []
